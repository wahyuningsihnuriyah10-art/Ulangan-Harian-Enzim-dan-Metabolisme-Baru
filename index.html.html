var Q=[
{t:'pg',tp:4,s:'Daging yang dimarinasi parutan nanas segar menjadi empuk karena protein dipecah enzim bromelain. Namun, bromelain tidak memecah pati pada nasi di wadah yang sama.<p>Karakteristik enzim yang paling tepat menjelaskan hal ini adalah bromelain ….</p>',o:['bersifat biokatalis sehingga ikut habis terpakai dalam reaksi','bekerja pada pH yang sama dengan semua enzim lainnya','memiliki sisi aktif yang hanya cocok dengan substrat tertentu','tersusun dari lemak sehingga larut dalam cairan buah nanas','mengubah arah reaksi sehingga protein tersusun dari asam amino'],k:2,e:'Bromelain hanya memecah protein karena sisi aktifnya hanya cocok dengan substrat tertentu (spesifik). Enzim tidak habis terpakai dan tersusun dari protein.'},
{t:'pg',tp:4,s:'Data penguraian H₂O₂ tanpa dan dengan enzim katalase:'+T(['Kondisi','Energi aktivasi (kJ/mol)','Energi reaktan','Energi produk'],[['Tanpa katalase','75','100','60'],['Dengan katalase','30','100','60']])+'<p>Cara enzim mempercepat reaksi berdasarkan data tersebut adalah ….</p>',o:['menurunkan energi produk sehingga energi yang dilepas lebih besar','menaikkan energi reaktan sehingga reaksi berlangsung lebih cepat','menurunkan energi reaktan sehingga jumlah produk bertambah banyak','menurunkan energi aktivasi tanpa mengubah energi reaktan dan produk','memperbesar selisih energi reaktan dan produk agar reaksi spontan'],k:3,e:'Energi aktivasi turun dari 75 menjadi 30 kJ/mol, sedangkan energi reaktan dan produk tetap.'},
{t:'pg',tp:4,s:'Pengaruh senyawa X terhadap laju reaksi enzim pada berbagai konsentrasi substrat (kondisi lain sama):'+T(['Substrat (mM)','Laju tanpa X (µmol/menit)','Laju dengan X (µmol/menit)'],[['1','20','11'],['4','50','33'],['16','80','67'],['64','94','89']])+'<p>Kesimpulan yang paling tepat tentang senyawa X adalah ….</p>',o:['inhibitor nonkompetitif, karena laju maksimum tetap turun pada substrat tinggi','inhibitor kompetitif, karena hambatan berkurang saat konsentrasi substrat naik','inhibitor nonkompetitif, karena senyawa X menempel pada sisi aktif enzim','inhibitor kompetitif, karena senyawa X mengubah laju maksimum enzim secara tetap','bukan inhibitor, karena laju reaksi tetap meningkat saat substrat bertambah'],k:1,e:'Pada substrat tinggi, laju dengan X mendekati laju tanpa X. Ini ciri inhibitor kompetitif yang bersaing dengan substrat di sisi aktif.'},
{t:'pg',tp:4,s:'Aktivitas enzim pemecah pati dari bakteri tanah pada berbagai suhu (pH dan substrat sama):'+T(['Suhu (°C)','10','20','30','40','50','60'],[['Aktivitas (unit/menit)','2','4','7','10','5','0']])+'<p>Penurunan aktivitas dari 40 °C hingga 60 °C terutama disebabkan oleh ….</p>',o:['struktur tiga dimensi enzim rusak sehingga sisi aktif tidak dapat mengikat substrat','substrat habis lebih cepat sehingga reaksi berhenti pada suhu tinggi','energi aktivasi reaksi meningkat sehingga substrat sulit bereaksi','jumlah molekul enzim berkurang karena terurai menjadi asam lemak','enzim kehilangan sisi aktif sehingga mengikat semua jenis substrat'],k:0,e:'Suhu di atas optimum mendenaturasi protein enzim sehingga bentuk sisi aktif berubah dan substrat tidak dapat berikatan.'},
{t:'pg',tp:4,s:'Seorang pasien GERD mengonsumsi obat penghambat pompa proton dosis tinggi jangka panjang sehingga pH lambung naik dari ±2 menjadi ±6. Pepsin bekerja optimal pada pH 1,5–2.<p>Dampak perubahan tersebut terhadap pepsin adalah ….</p>',o:['pepsin bekerja lebih cepat karena lingkungan lambung menjadi lebih netral','pepsin berubah fungsi menjadi pemecah karbohidrat di lambung','pepsin habis terpakai sehingga harus disintesis ulang tiap makan','pepsin tidak terpengaruh karena enzim hanya dipengaruhi suhu tubuh','aktivitas pepsin menurun karena pH menjauhi kisaran optimumnya'],k:4,e:'pH 6 jauh dari pH optimum pepsin sehingga aktivitasnya turun.'},
{t:'pg',tp:4,s:'Aktivitas katalase pada 5 g hati ayam dengan volume H₂O₂ berbeda (konsentrasi sama, suhu ruang), diukur dari tinggi busa:'+T(['Volume H₂O₂ (mL)','1','2','3','4','5','6'],[['Tinggi busa (cm)','2','4','6','7','7','7']])+'<p>Pada 4–6 mL tinggi busa tidak bertambah. Faktor pembatas yang paling mungkin adalah ….</p>',o:['suhu ruangan yang terus meningkat selama percobaan','jumlah enzim katalase sehingga seluruh sisi aktifnya sudah jenuh','volume H₂O₂ yang masih terlalu sedikit untuk diuraikan enzim','pH hati ayam yang berubah menjadi basa saat reaksi berlangsung','enzim katalase yang berubah menjadi substrat setelah bereaksi'],k:1,e:'Substrat sudah berlebih tetapi laju tidak naik: semua sisi aktif jenuh, sehingga jumlah enzim menjadi pembatas.'},
{t:'pg',tp:5,s:'Kekurangan niasin (vitamin B3) dalam waktu lama mengganggu produksi energi sel karena niasin dibutuhkan untuk membentuk NAD⁺.<p>Peran NAD⁺ pada metabolisme sel adalah ….</p>',o:['memecah ikatan peptida pada protein menjadi asam amino','menyediakan sisi aktif tambahan pada enzim pencernaan','membawa elektron dan ion hidrogen pada reaksi oksidasi-reduksi','menurunkan energi aktivasi tanpa berikatan dengan enzim','menghambat enzim agar reaksi tidak berlangsung berlebihan'],k:2,e:'NAD⁺ adalah koenzim pembawa elektron dan hidrogen (menjadi NADH) pada glikolisis dan siklus Krebs.'},
{t:'pg',tp:5,s:'Saat berlari 100 meter, otot rangka atlet kekurangan oksigen sehingga sel otot menghasilkan asam laktat.<p>Peran utama pembentukan asam laktat bagi sel otot adalah ….</p>',o:['meregenerasi NAD⁺ dari NADH agar glikolisis tetap dapat menghasilkan ATP','membuang CO₂ hasil siklus Krebs agar otot tidak mengalami kelelahan','mengubah asam laktat menjadi glukosa langsung di dalam otot','menghasilkan ATP lebih banyak dibandingkan respirasi aerob','mengaktifkan rantai transpor elektron saat oksigen tidak tersedia'],k:0,e:'Fermentasi laktat mengoksidasi NADH menjadi NAD⁺ sehingga glikolisis tetap berjalan tanpa oksigen.'},
{t:'pg',tp:5,s:'Sianida menghambat sitokrom c oksidase, enzim terakhir rantai transpor elektron di membran dalam mitokondria.<p>Akibat langsung terhadap metabolisme sel adalah ….</p>',o:['produksi ATP melalui fosforilasi oksidatif meningkat karena elektron dialihkan','glikolisis terhenti total karena enzim heksokinase ikut dihambat sianida','kadar NAD⁺ dalam matriks mitokondria meningkat karena NADH lebih cepat teroksidasi','NADH dan FADH₂ menumpuk karena tidak dapat dioksidasi menjadi NAD⁺ dan FAD','asetil-KoA berubah menjadi piruvat sehingga siklus Krebs berjalan terbalik'],k:3,e:'Rantai transpor elektron terhenti sehingga NADH dan FADH₂ tidak teroksidasi dan menumpuk; ATP turun drastis.'},
{t:'pg',tp:5,s:'Herbisida diuron menghambat aliran elektron pada fotosistem II di membran tilakoid.<p>Akibat langsung terhadap anabolisme pada gulma adalah ….</p>',o:['klorofil terurai sehingga daun tidak lagi dapat menyerap cahaya merah','stomata menutup permanen sehingga CO₂ tidak dapat masuk ke daun','siklus Calvin berjalan lebih cepat karena ATP dan NADPH menumpuk','rubisco berubah menjadi enzim pemecah gula menjadi CO₂ dan air','ATP dan NADPH berkurang sehingga CO₂ tidak dapat direduksi menjadi gula'],k:4,e:'Reaksi terang menghasilkan ATP dan NADPH yang dibutuhkan siklus Calvin untuk mereduksi CO₂ menjadi gula.'},
{t:'pg',tp:5,s:'Pada pembuatan tape singkong, rasa menjadi manis pada hari kedua dan beraroma alkohol pada hari ketiga, dibantu kapang dan khamir dalam ragi tape.<p>Peristiwa biokimia yang menjelaskan perubahan itu adalah ….</p>',o:['protease dari ragi mengubah protein singkong menjadi gula sederhana','amilase memecah pati menjadi gula, lalu khamir memfermentasi gula menjadi etanol','ragi mengoksidasi pati langsung menjadi etanol dengan bantuan oksigen','laktase mengubah pati menjadi asam laktat sehingga tape terasa manis','khamir menyintesis pati dari gula sehingga tekstur singkong melunak'],k:1,e:'Amilase menghidrolisis pati menjadi gula (manis); khamir lalu memfermentasi gula menjadi etanol dan CO₂.'},
{t:'pg',tp:5,s:'Seorang remaja 15 tahun mengalami kembung, banyak gas, dan diare 30–60 menit setelah minum susu sapi. Tes napas hidrogen meningkat; ia didiagnosis intoleransi laktosa.<p>Penyebab gejala tersebut adalah ….</p>',o:['enzim laktase terlalu banyak sehingga susu terurai menjadi lemak','protein susu tidak dapat diikat oleh sisi aktif enzim protease','aktivitas laktase rendah sehingga laktosa diuraikan bakteri usus menjadi gas','laktosa berubah menjadi glukosa terlalu cepat sehingga gula darah turun','enzim laktase terdenaturasi oleh pH usus halus yang terlalu basa'],k:2,e:'Laktase rendah membuat laktosa tidak tercerna; bakteri usus memfermentasinya menjadi gas dan asam.'},
{t:'mc',tp:4,s:'Hati ayam segar menghasilkan banyak busa saat ditetesi H₂O₂, sedangkan hati ayam yang telah direbus tidak. Busa berasal dari kerja enzim katalase.<p>Pernyataan yang benar tentang karakteristik enzim adalah ….</p>',o:['Enzim menggeser kesetimbangan reaksi agar produk yang terbentuk lebih banyak.','Enzim tidak ikut habis bereaksi sehingga dapat digunakan berulang kali.','Enzim yang telah terdenaturasi oleh panas akan pulih kembali saat suhu diturunkan.','Bentuk sisi aktif yang komplementer dengan substrat membuat enzim bersifat spesifik.','Enzim dapat bekerja di luar sel, misalnya enzim pencernaan yang disekresikan ke saluran pencernaan.'],k:[1,3,4],e:'Enzim tidak menggeser kesetimbangan (hanya mempercepat tercapainya), dan denaturasi akibat panas umumnya tidak pulih.'},
{t:'mc',tp:4,s:'Seorang murid menyelidiki pengaruh suhu (5 °C, 30 °C, 50 °C) terhadap aktivitas katalase kentang dalam larutan H₂O₂, dengan mengukur tinggi busa setelah 2 menit.<p>Pernyataan yang benar tentang rancangan penyelidikan tersebut adalah ….</p>',o:['Suhu larutan merupakan variabel bebas dalam penyelidikan ini.','Jenis umbi boleh berbeda antartabung asalkan massanya sama.','Tinggi busa yang terbentuk merupakan variabel terikat.','Cuka boleh ditambahkan ke salah satu tabung karena pH tidak memengaruhi katalase.','Volume H₂O₂ dan massa kentang harus sama pada setiap tabung sebagai variabel kontrol.'],k:[0,2,4],e:'Jenis umbi dan pH harus dikontrol. Hanya suhu (variabel bebas) yang boleh berbeda antartabung.'},
{t:'mc',tp:5,s:'Skema respirasi seluler aerob:<p style="background:var(--sel);padding:8px;border-radius:8px">Glukosa → <b>P</b> → 2 Piruvat → <b>Q</b> → 2 Asetil-KoA → <b>R</b> → NADH dan FADH₂ → <b>S</b> → H₂O + banyak ATP</p>P = glikolisis; Q = dekarboksilasi oksidatif; R = siklus Krebs; S = transpor elektron dan fosforilasi oksidatif.<p>Pernyataan yang benar berdasarkan skema tersebut adalah ….</p>',o:['Tahap P berlangsung di sitoplasma dan tidak memerlukan oksigen.','Tahap Q berlangsung di sitoplasma dan menghasilkan ATP terbanyak.','Tahap R menghasilkan NADH, FADH₂, dan CO₂ di matriks mitokondria.','Tahap S menggunakan oksigen sebagai akseptor elektron terakhir.','Tahap S menghasilkan CO₂ dari pemecahan asetil-KoA.'],k:[0,2,3],e:'Tahap Q terjadi di matriks mitokondria; ATP terbanyak dihasilkan di tahap S; CO₂ dilepas di tahap Q dan R, bukan S.'},
{t:'mc',tp:5,s:'Setelah latihan berat, seorang atlet mengonsumsi makanan tinggi karbohidrat dan protein untuk pemulihan. Berbagai reaksi metabolisme dikatalisis enzim di tubuhnya.<p>Proses yang tergolong <b>anabolisme</b> adalah ….</p>',o:['Pembentukan glikogen dari glukosa pada hati dan otot.','Sintesis trigliserida dari kelebihan karbohidrat di sel lemak.','Oksidasi asam lemak menjadi asetil-KoA di mitokondria.','Sintesis protein otot dari asam amino setelah latihan.','Pemecahan glikogen otot menjadi glukosa-6-fosfat saat berlari.'],k:[0,1,3],e:'Anabolisme = penyusunan molekul kompleks (glikogen, trigliserida, protein). Oksidasi asam lemak dan pemecahan glikogen adalah katabolisme.'},
{t:'tf',tp:4,s:'Murid menyelidiki amilase ludah pada larutan pati 1%. Empat tabung berisi 2 mL pati dan 1 mL ludah encer diinkubasi 15 menit, lalu ditetesi iodium (pati + iodium = biru kehitaman).'+T(['Tabung','Perlakuan','Warna setelah iodium'],[['1','4 °C, pH 7','Biru kehitaman pekat'],['2','37 °C, pH 7','Kuning kecokelatan'],['3','37 °C, pH 2 (HCl)','Biru kehitaman pekat'],['4','100 °C, pH 7','Biru kehitaman pekat']]),o:['Tabung 4 tetap biru kehitaman karena suhu 100 °C mendenaturasi amilase sehingga pati tidak terurai.','Tabung 1 tetap biru kehitaman karena suhu 4 °C merusak amilase secara permanen.','Perbandingan tabung 2 dan 3 menunjukkan bahwa pH 2 menurunkan aktivitas amilase ludah.'],k:['B','S','B'],e:'Suhu 100 °C mendenaturasi amilase. Suhu 4 °C hanya memperlambat reaksi tanpa merusak enzim secara permanen. Tabung 2 dan 3 hanya berbeda pH.'},
{t:'tf',tp:5,s:'Raka (16 tahun) minum dua botol minuman manis kemasan setiap hari dan jarang berolahraga; berat badannya naik 7 kg dalam enam bulan. Anjuran Kemenkes: gula maksimal 50 g per hari.'+T(['Informasi per kemasan (350 mL)','Jumlah'],[['Energi','150 kkal'],['Gula','38 g'],['Lemak','0 g']]),o:['Saat puasa, sel tidak dapat mengoksidasi asam lemak dan hanya dapat menggunakan glukosa sebagai sumber energi.','Insulin merangsang sel mengambil glukosa dan hati menyimpannya sebagai glikogen sehingga kadar glukosa darah turun.','Energi dari gula berlebih yang tidak terpakai dapat diubah menjadi lemak melalui reaksi anabolisme.'],k:['S','B','B'],e:'Saat puasa sel tetap mengoksidasi asam lemak. Insulin menurunkan glukosa darah; kelebihan energi disimpan sebagai lemak (anabolisme).'},
{t:'tf',tp:5,s:'Pak Darto, pengrajin tempe, memfermentasi kedelai rebus dengan ragi tempe (<i>Rhizopus oligosporus</i>) pada suhu 30–37 °C selama 36–48 jam hingga miselium putih menyatukan biji kedelai. Suatu hari ia menaruh satu nampan di ruang bersuhu ±50 °C agar lebih cepat jadi, tetapi miselium tidak tumbuh.',o:['<i>Rhizopus</i> menghasilkan enzim protease yang menguraikan protein kedelai sehingga tempe lebih mudah dicerna.','Enzim pada fermentasi tempe dilepaskan ke luar sel kapang sehingga substrat dicerna di luar sel sebelum hasilnya diserap.','Inkubasi pada suhu 50 °C mempercepat pembentukan tempe karena kenaikan suhu selalu meningkatkan aktivitas enzim.'],k:['B','B','S'],e:'Enzim kapang disekresikan ke luar sel. Suhu 50 °C melampaui batas hidup kapang dan merusak enzim; suhu tinggi tidak selalu mempercepat reaksi.'},
{t:'tf',tp:4,s:'Seorang pria 52 tahun berkolesterol LDL tinggi diberi statin, yang menghambat HMG-KoA reduktase (enzim kunci sintesis kolesterol di hati). Struktur statin mirip substrat alami enzim sehingga dapat menempati sisi aktif.',o:['Statin berikatan pada sisi aktif HMG-KoA reduktase sehingga bersaing dengan substrat alaminya.','Statin tergolong inhibitor nonkompetitif karena menempel di luar sisi aktif enzim.','Penghambatan enzim tersebut meningkatkan laju sintesis kolesterol di hati.'],k:['B','S','S'],e:'Statin adalah inhibitor kompetitif (menempati sisi aktif), sehingga sintesis kolesterol menurun, bukan meningkat.'}
];

else q.o.forEach(function(o,j){var s=q.t=='mc'?a.indexOf(j)>-1:a===j,ck=q.t=='mc'?q.k.indexOf(j)>-1:q.k===j,c='o'+(rv?(ck?' ok':s?' no':''):s?' s':'');h+='<label class="'+c+'"><input type="'+(q.t=='mc'?'checkbox':'radio')+'" name="q'+i+'" '+(rv?'disabled':'onchange="pick('+i+','+j+',this)"')+(s?' checked':'')+'><span><b>'+L[j]+'.</b> '+o+(rv&&ck?' ✓':rv&&s?' ✗':'')+'</span></label>'});
if(rv){var r=R[i];h+='<div class="ex"><span class="pill '+(r.p==r.m?'ok':'no')+'">Skor '+r.p+' / '+r.m+'</span><br><b>Kunci:</b> '+(q.t=='pg'?L[q.k]:q.t=='mc'?q.k.map(function(x){return L[x]}).join(', '):q.k.map(function(x){return x=='B'?'Benar':'Salah'}).join(' · '))+'<br>'+q.e+'</div>'}return h+'</div>'}
function pick(i,j,el){var q=Q[i];if(q.t=='mc'){var a=A[i],x=a.indexOf(j);if(el.checked){if(x<0)a.push(j)}else if(x>-1)a.splice(x,1)}else A[i]=j;el.closest('.q').querySelectorAll('.o').forEach(function(o){o.classList.toggle('s',o.querySelector('input').checked)});pg()}
function done(i){var a=A[i];return Q[i].t=='tf'?a.every(function(x){return x}):Q[i].t=='mc'?a.length>0:a!==null}
function pg(){var n=Q.filter(function(q,i){return done(i)}).length,e=document.getElementById('pc');if(e){e.textContent=n+'/20';document.getElementById('pb').style.width=n*5+'%'}}
function quiz(){var h='<div class="bar"><span>'+P.n+' · '+P.k+'</span><span class="prog"><i id="pb"></i></span><b id="pc">0/20</b></div>',last='';Q.forEach(function(q,i){if(q.t!=last){h+='<div class="sec">'+SEC[q.t]+'</div>';last=q.t}h+=qhtml(q,i,false)});h+='<div class="c"><button onclick="sub()">Kirim Jawaban</button> <span class="mu" id="wr"></span></div>';$(h);pg()}
var R=[];
function score(){R=Q.map(function(q,i){var a=A[i],p=0;if(q.t=='pg')p=a===q.k?4:0;else if(q.t=='mc'){var c=a.filter(function(x){return q.k.indexOf(x)>-1}).length,w=a.length-c;p=w>0?0:[0,1,3,6][c]}else{var c2=0;q.k.forEach(function(x,j){if(a[j]==x)c2++});p=[0,1,4,7][c2]}return{p:p,m:MAX[q.t]}})}

function result(){var t=sum(function(){return true})[0],h='',lv,fb;

var ty=[['pg','Pilihan ganda'],['mc','Pilihan ganda kompleks'],['tf','Benar–salah kasus']];h+='<div class="c"><h2>Rincian Skor</h2>'+T(['Bagian','Skor'],ty.map(function(y){var s=sum(function(q){return q.t==y[0]});return[y[1],s[0]+' / '+s[1]]}))+'</div>';
var t4=sum(function(q){return q.tp==4}),t5=sum(function(q){return q.tp==5}),p4=Math.round(t4[0]/t4[1]*100),p5=Math.round(t5[0]/t5[1]*100);

h+='<div class="c"><div class="row"><button onclick="rev()">Lihat Pembahasan</button><button class="g" onclick="cp()">Salin Hasil</button></div><div id="cm" class="mu" style="margin-top:8px"></div></div>';$(h)}
